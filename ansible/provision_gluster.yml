---
# Provision GlusterFS distributed storage
# 1×3 replicated volume on manager nodes, mounted on all 7 nodes
- name: Provision GlusterFS
  hosts: swarm
  become: true
  gather_facts: false
  vars:
    gluster_volume: swarm-storage
    gluster_mount: /gluster-mount
    gluster_bricks:
      - node1:/srv/gluster/brick
      - node2:/srv/gluster/brick
      - node3:/srv/gluster/brick
  tasks:
    - name: Install GlusterFS
      apt:
        name: glusterfs-server
        state: present
        update_cache: true
      tags: [install]

    - name: Ensure GlusterFS service is running
      service:
        name: glusterd
        state: started
        enabled: true
      tags: [install]

    - name: Create brick directory
      file:
        path: /srv/gluster/brick
        state: directory
        mode: '0755'
      tags: [setup]

    - name: Probe Gluster peers from node1
      shell: gluster peer probe {{ hostvars[item].ansible_host }}
      loop:
        - node2
        - node3
      delegate_to: node1
      run_once: true
      tags: [volume]

    - name: Create replicated volume from node1
      shell: "gluster volume create {{ gluster_volume }} replica 3 {{ gluster_bricks | join(' ') }} force"
      delegate_to: node1
      run_once: true
      tags: [volume]

    - name: Start GlusterFS volume
      shell: gluster volume start {{ gluster_volume }}
      delegate_to: node1
      run_once: true
      tags: [volume]

    - name: Wait for volume to be ready
      shell: |
        for i in $(seq 1 10); do
          gluster volume info {{ gluster_volume }} 2>/dev/null | grep -q "Status: Started" && break
          sleep 3
        done
      delegate_to: node1
      run_once: true
      tags: [volume]

    - name: Mount GlusterFS via fstab
      mount:
        src: localhost:/{{ gluster_volume }}
        path: "{{ gluster_mount }}"
        fstype: glusterfs
        opts: defaults,_netdev
        state: mounted
      tags: [mount]
