---
# Initialize Docker Swarm cluster
# Runs from control machine via Ansible
- name: Initialize Swarm
  hosts: swarm
  become: false
  gather_facts: false
  vars:
    manager_ip: "{{ hostvars['node1'].ansible_host }}"
  tasks:
    - name: Initialise Swarm on node1
      shell: docker swarm init --advertise-addr {{ manager_ip }}
      delegate_to: node1
      run_once: true
      register: swarm_init

    - name: Extract manager join token
      shell: docker swarm join-token -q manager
      delegate_to: node1
      run_once: true
      register: manager_token

    - name: Extract worker join token
      shell: docker swarm join-token -q worker
      delegate_to: node1
      run_once: true
      register: worker_token

    - name: Set fact — manager token
      set_fact:
        swarm_manager_token: "{{ manager_token.stdout }}"

    - name: Set fact — worker token
      set_fact:
        swarm_worker_token: "{{ worker_token.stdout }}"

    - name: Join additional managers
      shell: "docker swarm join --token {{ swarm_manager_token }} {{ manager_ip }}:2377"
      when:
        - inventory_hostname in groups['managers']
        - inventory_hostname != 'node1'

    - name: Join workers
      shell: "docker swarm join --token {{ swarm_worker_token }} {{ manager_ip }}:2377"
      when: inventory_hostname in groups['workers']
