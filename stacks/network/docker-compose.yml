# Network Stack — Pi-hole, WireGuard, UniFi Controller

version: "3.8"

services:
  pihole:
    image: pihole/pihole:latest
    network_mode: host
    environment:
      TZ: "UTC"
      WEBPASSWORD_FILE: /run/secrets/pihole_webpw
      WEB_PORT: "80"
      WEB_NETWORK_INTERFACE: "eth0"
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    secrets:
      - pihole_webpw
    deploy:
      placement:
        constraints:
          - node.labels.ha.candidate == true
      resources:
        limits:
          memory: 256M
    restart: always
    # Pi-hole uses host networking — VIP floats via Keepalived

  wireguard:
    image: linuxserver/wireguard:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - wireguard_data:/config
      - /lib/modules:/lib/modules:ro
    environment:
      TZ: "UTC"
      PERSISTENT_KEEPALIVE: "0"
      PEERS: ""
    deploy:
      placement:
        constraints:
          - node.labels.ha.candidate == true
      resources:
        limits:
          memory: 128M
    restart: always
    # WireGuard uses host networking — VIP floats via Keepalived

  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:latest
    ports:
      - 8443:8443
      - 8080:8080
      - 3478:3478/udp
      - 10001:10001/udp
      - 1900:1900/udp
      - 8843:8843
      - 8880:8880
      - 9443:9443
      - 10003:10003/udp
      - 10004:10004/udp
      - 5514:5514/udp
    volumes:
      - unifi_data:/config
    environment:
      TZ: "UTC"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    restart: always
    # Uses Swarm routing mesh — standard port publishing

volumes:
  pihole_data:
    external: true
  pihole_dnsmasq:
    external: false
  wireguard_data:
    external: true
  unifi_data:
    external: true

secrets:
  pihole_webpw:
    external: true
